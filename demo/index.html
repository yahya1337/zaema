<script type="module">

import React, {
  useState,
  useEffect,
  useRef,
  useCallback
} from "react";

import {
  createRoot
} from "react-dom/client";


const h = React.createElement;


/*
  The normal location is:

  demo/public/model/

  We also check a few common alternatives automatically.
*/
let BASE = "./public/model";

const COMMON = {
  mel: "Melanoma",
  nv: "Mole (nevus)"
};


/* --------------------------------------------------------------------------
   PREPROCESSING
   -------------------------------------------------------------------------- */

function preprocess(image, spec, canvas) {

  const [inW, inH] = spec.input_size;

  const [srcW, srcH] =
    spec.source_size ??
    [image.naturalWidth, image.naturalHeight];

  const [cropW, cropH] =
    spec.crop_size ??
    [srcW, srcH];


  const boxW = Math.min(
    image.naturalWidth,
    (cropW / srcW) * image.naturalWidth
  );


  const boxH = Math.min(
    image.naturalHeight,
    (cropH / srcH) * image.naturalHeight
  );


  const x =
    Math.random() *
    (image.naturalWidth - boxW);


  const y =
    Math.random() *
    (image.naturalHeight - boxH);


  canvas.width = inW;
  canvas.height = inH;


  const context =
    canvas.getContext(
      "2d",
      {
        willReadFrequently: true
      }
    );


  context.drawImage(
    image,
    x,
    y,
    boxW,
    boxH,
    0,
    0,
    inW,
    inH
  );


  const {
    data
  } =
    context.getImageData(
      0,
      0,
      inW,
      inH
    );


  const tensor =
    new Float32Array(
      3 * inW * inH
    );


  for (
    let p = 0,
    n = inW * inH;
    p < n;
    p++
  ) {

    for (
      let c = 0;
      c < 3;
      c++
    ) {

      tensor[c * n + p] =
        (
          data[p * 4 + c] / 255
          - spec.mean[c]
        )
        / spec.std[c];

    }
  }


  return new ort.Tensor(
    "float32",
    tensor,
    [1, 3, inH, inW]
  );
}


/* --------------------------------------------------------------------------
   SOFTMAX
   -------------------------------------------------------------------------- */

function softmax(logits) {

  const top =
    Math.max(...logits);


  const exps =
    logits.map(
      v => Math.exp(v - top)
    );


  const total =
    exps.reduce(
      (a, b) => a + b,
      0
    );


  return exps.map(
    v => v / total
  );
}


/* --------------------------------------------------------------------------
   CLASSIFICATION
   -------------------------------------------------------------------------- */

async function classify(
  session,
  image,
  spec,
  canvas
) {

  const views =
    spec.views ?? 1;


  const summed =
    new Array(
      spec.classes.length
    ).fill(0);


  for (
    let v = 0;
    v < views;
    v++
  ) {

    const output =
      await session.run({
        image:
          preprocess(
            image,
            spec,
            canvas
          )
      });


    const probabilities =
      softmax(
        Array.from(
          Object.values(output)[0].data
        )
      );


    probabilities.forEach(
      (p, i) => {
        summed[i] += p / views;
      }
    );
  }


  return summed;
}


/* --------------------------------------------------------------------------
   SCOREBOARD
   -------------------------------------------------------------------------- */

function Scoreboard({
  human,
  machine,
  rounds
}) {

  const pct =
    n =>
      rounds
        ? `${Math.round(
            (100 * n) / rounds
          )}%`
        : "—";


  return h(
    "table",
    null,

    h(
      "thead",
      null,

      h(
        "tr",
        null,

        h(
          "th",
          null,

          "After " +
          rounds +
          (
            rounds === 1
              ? " lesion"
              : " lesions"
          )
        ),

        h(
          "th",
          null,
          "Correct"
        ),

        h(
          "th",
          null,
          "Rate"
        )
      )
    ),

    h(
      "tbody",
      null,

      h(
        "tr",
        null,

        h(
          "td",
          {
            className:
              "score-human"
          },
          "You"
        ),

        h(
          "td",
          null,
          human
        ),

        h(
          "td",
          null,
          pct(human)
        )
      ),

      h(
        "tr",
        null,

        h(
          "td",
          {
            className:
              "score-machine"
          },
          "Machine"
        ),

        h(
          "td",
          null,
          machine
        ),

        h(
          "td",
          null,
          pct(machine)
        )
      )
    )
  );
}


/* --------------------------------------------------------------------------
   MAIN APP
   -------------------------------------------------------------------------- */

function App() {

  const [
    status,
    setStatus
  ] =
    useState(
      "Loading model…"
    );


  const [
    pool,
    setPool
  ] =
    useState(null);


  const [
    spec,
    setSpec
  ] =
    useState(null);


  const [
    current,
    setCurrent
  ] =
    useState(null);


  const [
    answer,
    setAnswer
  ] =
    useState(null);


  const [
    score,
    setScore
  ] =
    useState({
      human: 0,
      machine: 0,
      rounds: 0
    });


  const [
    missed,
    setMissed
  ] =
    useState({
      human: 0,
      machine: 0,
      melanomas: 0
    });


  const session =
    useRef(null);


  const canvas =
    useRef(
      document.createElement(
        "canvas"
      )
    );


  const imageRef =
    useRef(null);


  const deck =
    useRef([]);


  /* ------------------------------------------------------------------------
     DRAW A RANDOM IMAGE
     ------------------------------------------------------------------------ */

  const draw =
    useCallback(
      images => {

        if (
          !Array.isArray(images) ||
          images.length === 0
        ) {

          throw new Error(
            "pool.json loaded, but it contains no images."
          );
        }


        if (
          deck.current.length === 0
        ) {

          deck.current =
            [...images];


          for (
            let i =
              deck.current.length - 1;
            i > 0;
            i--
          ) {

            const j =
              Math.floor(
                Math.random() *
                (i + 1)
              );


            [
              deck.current[i],
              deck.current[j]
            ] =
            [
              deck.current[j],
              deck.current[i]
            ];
          }
        }


        return deck.current.pop();
      },
      []
    );


  /* ------------------------------------------------------------------------
     LOAD MODEL + JSON FILES
     ------------------------------------------------------------------------ */

  useEffect(
    () => {

      (
        async () => {

          try {

            /*
              Check several possible model locations.

              Recommended:
              demo/public/model/

              Alternatives:
              demo/model/
              demo/public/models/
              ../public/model/
            */

            const BASE_CANDIDATES = [
              "./public/model",
              "./model",
              "./public/models",
              "../public/model"
            ];


            let loadedBase =
              null;


            let labels =
              null;


            let poolData =
              null;


            for (
              const candidate
              of BASE_CANDIDATES
            ) {

              try {

                const labelsResponse =
                  await fetch(
                    `${candidate}/labels.json`,
                    {
                      cache:
                        "no-store"
                    }
                  );


                const poolResponse =
                  await fetch(
                    `${candidate}/pool.json`,
                    {
                      cache:
                        "no-store"
                    }
                  );


                if (
                  !labelsResponse.ok ||
                  !poolResponse.ok
                ) {
                  continue;
                }


                const labelsText =
                  await labelsResponse.text();


                const poolText =
                  await poolResponse.text();


                /*
                  GitHub Pages may return
                  an HTML/XML error page.
                */

                if (
                  labelsText
                    .trim()
                    .startsWith("<") ||
                  poolText
                    .trim()
                    .startsWith("<")
                ) {
                  continue;
                }


                labels =
                  JSON.parse(
                    labelsText
                  );


                poolData =
                  JSON.parse(
                    poolText
                  );


                loadedBase =
                  candidate;


                break;

              } catch (_) {

                /*
                  Try the next candidate.
                */

              }
            }


            if (
              !loadedBase
            ) {

              throw new Error(
                "Could not find labels.json and pool.json. " +
                "They must be inside demo/public/model/ " +
                "(recommended), demo/model/, or demo/public/models/."
              );
            }


            BASE =
              loadedBase;


            setSpec(
              labels
            );


            setPool(
              poolData
            );


            setStatus(
              "Downloading network (10 MB)…"
            );


            /*
              Load the ONNX model.
            */

            try {

              session.current =
                await ort.InferenceSession.create(
                  `${BASE}/model.onnx`,
                  {
                    executionProviders:
                      ["wasm"]
                  }
                );

            } catch (modelError) {

              throw new Error(
                "model.onnx could not be loaded. " +
                "Check that demo/public/model/model.onnx exists. " +
                `(${modelError.message})`
              );
            }


            setStatus(null);


            setCurrent(
              draw(
                poolData.images
              )
            );


          } catch (error) {

            setStatus(
              `Could not start: ${error.message}`
            );

          }

        }
      )();

    },
    []
  );


  /* ------------------------------------------------------------------------
     NEXT LESION
     ------------------------------------------------------------------------ */

  const next =
    useCallback(
      () => {

        setAnswer(null);

        setCurrent(
          draw(
            pool.images
          )
        );

      },
      [pool, draw]
    );


  /* ------------------------------------------------------------------------
     USER CHOICE
     ------------------------------------------------------------------------ */

  const choose =
    useCallback(
      async choice => {

        if (
          !current ||
          answer ||
          !session.current
        ) {
          return;
        }


        const truth =
          current.dx;


        try {

          const probabilities =
            await classify(
              session.current,
              imageRef.current,
              spec,
              canvas.current
            );


          const machineChoice =
            spec.classes[
              probabilities.indexOf(
                Math.max(
                  ...probabilities
                )
              )
            ];


          const humanRight =
            choice === truth;


          const machineRight =
            machineChoice === truth;


          setAnswer({
            truth,
            choice,
            machineChoice,
            probabilities,
            humanRight,
            machineRight
          });


          setScore(
            s => ({
              human:
                s.human +
                (
                  humanRight
                    ? 1
                    : 0
                ),

              machine:
                s.machine +
                (
                  machineRight
                    ? 1
                    : 0
                ),

              rounds:
                s.rounds + 1
            })
          );


          if (
            truth === "mel"
          ) {

            setMissed(
              m => ({
                human:
                  m.human +
                  (
                    humanRight
                      ? 0
                      : 1
                  ),

                machine:
                  m.machine +
                  (
                    machineRight
                      ? 0
                      : 1
                  ),

                melanomas:
                  m.melanomas + 1
              })
            );
          }


        } catch (error) {

          setStatus(
            `Could not classify image: ${error.message}`
          );

        }

      },
      [
        current,
        answer,
        spec
      ]
    );


  /* ------------------------------------------------------------------------
     LOADING / ERROR SCREEN
     ------------------------------------------------------------------------ */

  if (status) {

    return h(
      "main",
      null,

      h(
        "p",
        {
          className:
            "note"
        },
        status
      )
    );
  }


  /* ------------------------------------------------------------------------
     IMAGE URL
     ------------------------------------------------------------------------ */

  const imageUrl =
    current
      ? `${BASE}/images/${current.image_id}.jpg`
      : "";


  /* ------------------------------------------------------------------------
     PAGE
     ------------------------------------------------------------------------ */

  return h(
    "main",
    null,


    /* HEADER */

    h(
      "div",
      {
        style: {
          textAlign:
            "center",

          marginBottom:
            ".65rem"
        }
      },


      h(
        "h1",
        {
          style: {
            fontFamily:
              "Times New Roman, serif",

            fontSize:
              "1.8rem",

            fontWeight:
              "500",

            color:
              "#16181d",


            margin: "1.5rem 0 .5rem",
            letterSpacing:
              "-.02em",

            lineHeight:
              "1.15"
          }
        },


        "Can You Spot ",


        h(
          "span",
          {
            style: {
              color:
                "#c62828"
            }
          },
          "Melanoma"
        ),


        " ",


        h("br"),


        "Before ",


        h(
          "span",
          {
            style: {
              color:
                "#2563eb"
            }
          },
          "AI"
        ),


        " Does ? "
      ),


      h(
        "h2",
        {
          style: {
            fontFamily:
              "Georgia, serif",

            fontSize:
              "1.35rem",

            fontWeight:
              "700",

            color:
              "#16181d",

            margin:
              "0 0 .75rem"
          }
        },
        ""
      ),


         h(
  "p",
  {
    className: "lede",
    style: { margin: "-0.3rem auto 0" }
  },

        "One dermatoscopic image at a time: ",
        h("strong", null, "Melanoma"),
        " or an ordinary ",
        h("strong", null, "mole"),
        ". Make your call, and see how a neural network compares"
      )
    ),


    /* BOARD */

    h(
      "div",
      {
        className:
          "board"
      },


      /* LEFT CARD */

      h(
        "div",
        {
          className:
            "card"
        },


        h(
          "img",
          {
            ref:
              imageRef,

            className:
              "lesion",

            src:
              imageUrl,

            alt:
              "Dermatoscopic image of a skin lesion",

            crossOrigin:
              "anonymous"
          }
        ),


        /* CHOICES */

        h(
          "div",
          {
            className:
              "choices"
          },


          h(
            "button",
            {
              onClick:
                () => choose("mel"),

              disabled:
                !!answer
            },
            "Melanoma"
          ),


          h(
            "button",
            {
              onClick:
                () => choose("nv"),

              disabled:
                !!answer
            },
            "Mole"
          )
        ),


        /* VERDICT */

        answer &&
          h(
            "div",
            {
              className:
                "verdict"
            },


            h(
              "h3",
              null,

              "It was ",

              COMMON[
                answer.truth
              ]
            ),


            h(
              "div",
              {
                className:
                  "row"
              },


              h(
                "span",
                null,

                "You said ",

                COMMON[
                  answer.choice
                ]
              ),


              h(
                "span",
                {
                  className:
                    "right",

                  "data-correct":
                    String(
                      answer.humanRight
                    )
                },

                answer.humanRight
                  ? "correct"
                  : "wrong"
              )
            ),


            h(
              "div",
              {
                className:
                  "row"
              },


              h(
                "span",
                null,

                "Machine said ",

                COMMON[
                  answer.machineChoice
                ],

                " (",

                Math.round(
                  100 *
                  Math.max(
                    ...answer.probabilities
                  )
                ),

                "% confident)"
              ),


              h(
                "span",
                {
                  className:
                    "right",

                  "data-correct":
                    String(
                      answer.machineRight
                    )
                },

                answer.machineRight
                  ? "correct"
                  : "wrong"
              )
            ),


            h(
              "button",
              {
                onClick:
                  next,

                style: {
                  marginTop:
                    ".85rem",

                  width:
                    "100%"
                }
              },
              "Next lesion"
            )
          )
      ),


      /* RIGHT CARD */

      h(
        "div",
        {
          className:
            "card"
        },


        h(
          Scoreboard,
          score
        ),


        /* MELANOMA TALLY */

        missed.melanomas > 0 &&

          h(
            "div",
            {
              className:
                "tally"
            },


            `Of ${
              missed.melanomas
            } melanoma${
              missed.melanomas === 1
                ? ""
                : "s"
            } shown so far, you missed `,


            h(
              "strong",
              null,
              String(
                missed.human
              )
            ),


            " and the machine missed ",


            h(
              "strong",
              null,
              String(
                missed.machine
              )
            ),


            ".",


            (
              missed.human > 0 ||
              missed.machine > 0
            ) &&

              h(
                "div",
                {
                  style: {
                    marginTop:
                      ".4rem"
                  }
                },

                "A missed melanoma is the error that matters: " +
                "it is the one that gets sent home."
              )
          ),


        /* DATASET NOTE */

        h(
  "p",
  {
    className: "note"
  },

  "Across its full held-out set of 1,505 lesions the network scores ",

  h("strong", null, "0.84"),

  " balanced accuracy, but it misses ",

  h("strong", null, "36 of 154 melanomas"),

  ", roughly one in four. Overall accuracy of 90% hides that, because most lesions are moles."
),


/* LIMITATION */

h(
  "div",
  {
    className: "limitation"
  },

  h(
    "strong",
    null,
    "Limitation:"
  ),

  " This is a teaching demonstration, not a diagnostic tool. " +
  "Built from a public research dataset, the network misses roughly 1 in 4 melanomas " +
  "and was trained without ethnicity or Fitzpatrick skin-type data. " +
